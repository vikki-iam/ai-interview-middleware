# Values for prometheus-community/kube-prometheus-stack.
#
# Trimmed to fit three t3.small nodes. A t3.small admits 11 pods, so this stack
# is sized on pod COUNT as much as memory: four pods, ~475 MiB of requests.
#
# What was removed, and what it costs:
#   alertmanager    routed nowhere anyway - no Slack, no PagerDuty, no email
#   node-exporter   node CPU and disk. Pod metrics and the HPA are unaffected
#   defaultRules    they evaluate into a void with no alertmanager
#   Loki + Alloy    log collection. X-Request-Id can no longer be followed
#                   across both services in one query - use kubectl logs

# =============================================================================
# The single most important line in this file
# =============================================================================
prometheus:
  prometheusSpec:
    # Default is TRUE, which means "only pick up ServiceMonitors carrying this
    # release's label". Ours come from a different chart, so with the default
    # Prometheus ignores them - and there is no error. The targets page is
    # simply empty and everything looks healthy.
    #
    # This is the number one reason "I installed Prometheus but see no metrics".
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # Two hours. Long enough to watch an HPA scale and come back down; short
    # enough that memory stays flat on a small node.
    retention: 2h

    # No PVC. A volume means an EBS disk the CSI driver creates, which then has
    # to be cleaned up before terraform destroy - the trap the middleware's
    # volume already teaches once.
    storageSpec: null

    resources:
      requests:
        cpu: 100m
        memory: 250Mi
      limits:
        memory: 500Mi

grafana:
  # The chart generates a random admin password into a Secret:
  #   kubectl get secret -n observability kube-prometheus-stack-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  #
  # Not set here on purpose: a password in a values file is a password in git.
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 192Mi

  # ClusterIP, reached by port-forward. NOT on the ALB Ingress - that would put
  # a Grafana with a generated password on the public internet.
  #   kubectl port-forward -n observability svc/kube-prometheus-stack-grafana 3000:80
  service:
    type: ClusterIP

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

# =============================================================================
# Removed to fit
# =============================================================================
alertmanager:
  enabled: false

# A DaemonSet, so it costs one pod slot on EVERY node - the scarcest thing here.
#
# The toggle is `nodeExporter`, not `prometheus-node-exporter`. The latter is the
# subchart's own values block, and setting enabled there does nothing: the chart
# still renders the DaemonSet and nothing warns you.
nodeExporter:
  enabled: false

# Most of them alert on node-exporter metrics that no longer exist, and with no
# alertmanager none of them reach anybody.
defaultRules:
  create: false

# =============================================================================
# What a managed control plane does not let you scrape
#
# On EKS the API server is AWS's, and etcd, the scheduler and the controller
# manager are not reachable at all. Their default rules would fire permanently
# on a perfectly healthy cluster - which is how people learn to ignore alerts.
# =============================================================================
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
