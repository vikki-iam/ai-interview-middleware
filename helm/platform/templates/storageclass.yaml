{{- if .Values.createStorageClass }}
# EKS has no default StorageClass, so a PVC would stay Pending forever.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
# Create the disk only after a pod is scheduled, so it lands in the same zone.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
{{- end }}
