# The pod runs as this identity. The annotation is what lets it assume the IAM
# role and read Secrets Manager - no access key involved.
#
# The role's trust policy demands this exact name:
#   system:serviceaccount:ai-interview:middleware
# Rename either side and AWS returns AccessDenied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: middleware
  annotations:
    eks.amazonaws.com/role-arn: {{ required "aws.roleArn is required - the pod cannot reach Secrets Manager without it" .Values.aws.roleArn }}
