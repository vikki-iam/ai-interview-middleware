apiVersion: apps/v1
kind: Deployment
metadata:
  name: middleware
spec:
  replicas: {{ .Values.replicas }}

  # Stop the old pod before starting the new one. Uploaded files live inside
  # the pod now, so two pods running at once would each serve a different set
  # of resumes - one old, one empty.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: middleware
  template:
    metadata:
      labels:
        app: middleware
      annotations:
        # Restart the pod when the ConfigMap changes. Without this the pod keeps
        # running with the old values after a helm upgrade.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # This is what gives the pod its AWS identity
      serviceAccountName: middleware

      # The app runs as user 10001, but a fresh volume belongs to root.
      # fsGroup hands it to 10001 so the app can write uploads into it.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: middleware
          image: {{ .Values.imageRegistry }}/{{ .Values.imageRepository }}/middleware:{{ required "imageTag is required - pass --set imageTag=<sha>" .Values.imageTag }}
          ports:
            - name: http
              containerPort: 8080

          # Every setting comes from here. Nothing secret is in it.
          envFrom:
            - configMapRef:
                name: middleware-config

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi

          # Scratch space for uploaded resumes. See the volume below.
          volumeMounts:
            - name: resumes
              mountPath: {{ .Values.storage.path }}

      # emptyDir, not a PersistentVolumeClaim: the directory is created on the
      # node when the pod starts and deleted when it stops. Uploaded resumes do
      # NOT survive a restart or a redeploy.
      #
      # That is the deliberate trade for needing no EBS CSI driver and no
      # StorageClass. For durable uploads, set APP_STORAGE_TYPE=s3 and give the
      # pod's IRSA role access to a bucket.
      volumes:
        - name: resumes
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: middleware
  labels:
    # A ServiceMonitor selects on the labels of the SERVICE, not of the pods.
    # This is the one people get wrong: the selector looks identical either way
    # and a mismatch produces no error, just an empty target list.
    app: middleware
  annotations:
    # The ALB health check for this service's target group. The Ingress asks
    # for /healthz, which the middleware does not serve, so without this every
    # target would be marked unhealthy and /api would return 503.
    # A Service annotation beats the Ingress one for its own target group.
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
spec:
  selector:
    app: middleware
  ports:
    # Named, because a ServiceMonitor selects a Service port by name. Leave the
    # name off and Prometheus silently scrapes nothing.
    - name: http
      port: 8080
      targetPort: http
